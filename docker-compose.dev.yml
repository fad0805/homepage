services:
  db:
    env_file:
      - path: .env.production
        required: false
      - path: .env.development
        required: true

  api:
    command: sh -c "./entrypoint.sh uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: .env.production
        required: false
      - path: .env.development
        required: true
    environment:
      - ENVIRONMENT=development
      - DEV_ADMIN_SEED=true
    networks:
      - external_network
      - internal_network
    volumes:
      - ./api:/app
    ports:
      - 127.0.0.1:8000:8000

  web:
    build:
      dockerfile: ./Dockerfile-dev
    command: npm run dev
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

networks:
  external_network:
  internal_network:
    internal: true
