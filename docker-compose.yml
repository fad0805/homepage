x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    restart: always
    logging: *default-logging
    image: postgres:14-alpine
    env_file: .env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    networks:
      - internal_network
    volumes:
      - ./db:/var/lib/postgresql/data

  api:
    restart: always
    logging: *default-logging
    build: ./api
    networks:
      - external_network
      - internal_network
    volumes:
      - ./api/alembic/versions:/app/alembic/versions
      - uploads:/app/uploads
    depends_on:
      - db
    env_file: .env.production

  web:
    restart: always
    logging: *default-logging
    build: ./web
    networks:
      - external_network
      - internal_network
    ports:
      - "127.0.0.1:2222:3000"
    environment:
      - SITE_URL=${SITE_URL:-}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api:8000}
      - PUBLIC_DATA_REVALIDATE=${PUBLIC_DATA_REVALIDATE:-60}
    depends_on:
      - api
      - db

networks:
  external_network:
  internal_network:
    internal: true

volumes:
  uploads:
